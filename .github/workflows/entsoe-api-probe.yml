name: Test ENTSO-E API (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser tests without network
        run: python -m unittest discover -s tests -p 'test_entsoe*.py' -v
      - name: Check DAM and production with secret token
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/probe_entsoe.py
