name: ENTSO-E status (metadata only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: entsoe-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect only ENTSO-E API status
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/entsoe_status.py
      - name: Publish metadata-only status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if git diff --quiet -- data/entsoe-status.json && ! git ls-files --others --exclude-standard -- data/entsoe-status.json | grep -q .; then
            echo "Unchanged public status"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entsoe-status.json
          git commit -m 'Update ENTSO-E public metadata status'
          # Use temporary credentials without persisting a token in .git/config.
          for attempt in 1 2 3; do
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
