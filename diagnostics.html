<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Intel · Диагностика</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#e5edf8;font:15px system-ui,Segoe UI,sans-serif}main{max-width:1080px;margin:35px auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 8px}p{color:#a6b8cd;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:25px}.card{border:1px solid #263c58;border-radius:14px;background:#111e32;padding:18px;min-height:175px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{border-radius:999px;padding:5px 9px;background:#293244;font-size:12px}.ok{color:#59dbb8}.warn{color:#ffd27f}.fail{color:#ff929e}.name{font-size:18px;font-weight:650}.detail{font-size:13px;overflow-wrap:anywhere}.summary{margin-top:22px;padding:15px;border:1px solid #263c58;border-radius:10px;white-space:pre-wrap;color:#bed0e2;font:13px/1.6 ui-monospace,Consolas,monospace}button,a.btn{padding:10px 14px;border:1px solid #4c739e;border-radius:9px;background:#19334e;color:#ecf7ff;text-decoration:none;cursor:pointer}button:hover,a.btn:hover{background:#25445f}.actions{display:flex;gap:10px;flex-wrap:wrap}small{color:#a6b8cd}code{color:#b9e2fb}footer{margin-top:20px;color:#a6b8cd;font-size:13px}
</style></head><body><main><header><div><small>⚡ ENERGY INTEL · BULGARIA</small><h1>Диагностика на източниците</h1><p>Проверка на реално публикуваните данни. Не генерира и не публикува цени.</p></div><div class="actions"><button id="refresh">↻ Провери отново</button><a class="btn" href="./#market">← Към таблото</a><button id="copy">Копирай отчет</button></div></header><div class="grid" id="grid"></div><div class="summary" id="report">Зареждане…</div><footer>Проверка от браузъра · времената на измерване и извличане се показват отделно · HTTP 200 не гарантира актуални данни.</footer></main>
<script>
const sources=[
 {id:'eso',title:'ЕСО · системен товар',path:'data/eso.json',type:'eso'},
 {id:'generation',title:'ЕСО · производство',path:'data/eso-generation.json',type:'generation'},
 {id:'dam',title:'DAM · цени',path:'data/dam.json',type:'dam'},
 {id:'intraday',title:'Intraday · цени',path:'data/intraday.json',type:'intraday'}
];
let lastReport='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){if(!s)return 'няма';const d=new Date(s);return isNaN(+d)?String(s):d.toLocaleString('bg-BG',{timeZone:'Europe/Sofia',dateStyle:'medium',timeStyle:'medium'})+' (София)'}
function age(s){const t=Date.parse(s);return Number.isFinite(t)?Math.round((Date.now()-t)/60000):null}
function card(x){const div=document.createElement('article');div.className='card';div.id='card-'+x.id;div.innerHTML=`<div class="top"><span class="name">${esc(x.title)}</span><span class="tag">Проверка…</span></div><p class="detail">${esc(x.path||'API')}</p><p class="detail result">Зареждане…</p>`;document.querySelector('#grid').append(div);return div}
async function fetchJson(path){const r=await fetch(path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function inspect(x){let state='fail',msg='';try{const j=await fetchJson(x.path);const fetched=j.fetched_at||null;let records=[],last='';if(x.type==='eso'){records=j.load_mw;last=records?.at(-1)?.timestamp; if(!Array.isArray(records)||!records.length||!Number.isFinite(records.at(-1)?.value))throw Error('Невалиден товарен ред')}else if(x.type==='generation'){const vals=j.generation_mw||{};records=Object.keys(vals).filter(k=>Number.isFinite(vals[k]));if(records.length<3)throw Error('Няма достатъчно категории')}else{records=j.records;if(!Array.isArray(records)||!records.length)throw Error('Няма ценови записи');const key=x.type==='dam'?'dam_eur_mwh':'intraday_eur_mwh';if(!records.some(r=>Number.isFinite(r[key])))throw Error('Няма валидни цени');last=records.at(-1)?.timestamp}const mins=age(last||fetched);state=mins!==null&&mins>180?'warn':'ok';msg=`${records.length} ${x.type==='generation'?'категории':'записа'} · Извлечено: ${fmt(fetched)}${last?' · Последен интервал: '+fmt(last):''}${mins!==null&&mins>180?' · ВНИМАНИЕ: последните данни може да са стари':''}`;}catch(e){msg=e.message==='HTTP 404'?'Няма публикуван файл (HTTP 404). Колекторът не е записал публичен snapshot.':String(e.message)}return {state,msg}}
async function checkWeather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=42.6977&longitude=23.3219&hourly=shortwave_radiation&forecast_days=1&timezone=Europe%2FSofia';const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.hourly?.shortwave_radiation))throw Error('Непознат JSON');return{state:'ok',msg:'API отговори успешно · '+j.hourly.shortwave_radiation.length+' прогнозни интервала · прогноза, не измерено производство'}}catch(e){return{state:'fail',msg:'API недостъпно от този браузър: '+e.message}}}
async function run(){const grid=document.querySelector('#grid');grid.replaceChildren();const xs=[...sources,{id:'weather',title:'Open-Meteo · София',path:'API · публична метеопрогноза'}];xs.forEach(card);const results=await Promise.all(xs.map(async x=>({x,...(x.id==='weather'?await checkWeather():await inspect(x))})));const lines=['Energy Intel — отчет от '+new Date().toLocaleString('bg-BG',{timeZone:'Europe/Sofia'}),'Сайт: '+location.origin+location.pathname.replace(/diagnostics\.html$/,'')];for(const r of results){const c=document.querySelector('#card-'+r.x.id);c.querySelector('.tag').textContent=r.state==='ok'?'Налични':r.state==='warn'?'Провери актуалност':'Няма достъпни данни';c.querySelector('.tag').className='tag '+(r.state==='ok'?'ok':r.state==='warn'?'warn':'fail');c.querySelector('.result').textContent=r.msg;lines.push(r.x.title+': '+r.msg)}lastReport=lines.join('\n');document.querySelector('#report').textContent=lastReport}
document.querySelector('#refresh').onclick=run;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastReport);document.querySelector('#copy').textContent='Копирано ✓'}catch(e){alert('Копирането е блокирано от браузъра. Маркирай отчета и го копирай ръчно.')}};run();
</script></body></html>
