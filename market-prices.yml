name: Collect DAM and Intraday market data
on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
permissions:
  contents: write
concurrency:
  group: market-prices-publication
  cancel-in-progress: false
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect ENTSO-E DAM (if enabled)
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          MARKET_PUBLICATION_ALLOWED: ${{ vars.MARKET_PUBLICATION_ALLOWED }}
        run: python scripts/collect_dam.py
      - name: Collect IBEX Intraday (if licensed and enabled)
        env:
          IBEX_EXPORT_URL: ${{ secrets.IBEX_EXPORT_URL }}
          IBEX_EXPORT_TOKEN: ${{ secrets.IBEX_EXPORT_TOKEN }}
          INTRADAY_PUBLICATION_ALLOWED: ${{ vars.INTRADAY_PUBLICATION_ALLOWED }}
        run: python scripts/collect_intraday.py
      - name: Commit only permitted public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/dam.json data/intraday.json; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update permitted market price snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
